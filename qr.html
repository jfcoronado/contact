<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Código QR de contacto</title>
<style>
  :root { --bg: #ffffff; --text: #111827; --muted: #5b6475; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center;
  }
  img { width: min(80vw, 70vh, 480px); height: auto; image-rendering: pixelated; }
  h1 { font-size: 1.4rem; margin: 16px 0 0; }
  p { margin: 4px 0 0; color: var(--muted); }
  a { color: var(--muted); font-size: .85rem; margin-top: 24px; }
</style>
</head>
<body>
  <!-- Fondo siempre blanco a propósito: los lectores QR fallan con códigos invertidos. -->
  <img src="qr.svg" alt="Código QR que abre jfcoronado.github.io/contact">
  <h1>Jose Felix Coronado</h1>
  <p>jfcoronado.github.io/contact</p>
  <a href="./">← Volver</a>
</body>
</html>
